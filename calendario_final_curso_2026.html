<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario Final de Curso 2025-26</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f2;color:#1a1a18;padding:24px 16px;min-height:100vh}
h1{font-size:20px;font-weight:500;margin-bottom:20px;color:#1a1a18}
.header{display:flex;align-items:center;gap:20px;margin-bottom:24px;padding:16px 20px;background:#fff;border-radius:12px;border:0.5px solid #ddd}
.logo-svg{flex-shrink:0}
.header-text{}
.header-title{font-size:17px;font-weight:600;color:#3a3a38;line-height:1.3}
.header-sub{font-size:13px;color:#888;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.search-wrap{display:flex;align-items:center;gap:6px;background:#fff;border:0.5px solid #ccc;border-radius:8px;padding:0 10px;flex:1;min-width:180px;max-width:300px}
.search-wrap input{border:none;outline:none;font-size:13px;padding:8px 0;background:transparent;width:100%;color:#1a1a18}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat-btn{padding:5px 12px;border-radius:999px;font-size:12px;cursor:pointer;border:0.5px solid #aaa;background:#fff;color:#555;transition:all .15s}
.cat-btn.active{font-weight:500;color:#1a1a18;border-color:#555;background:#e8e8e4}
.cat-btn:hover{background:#f0f0ec}
.months-wrap{display:flex;flex-direction:column;gap:28px}
.month-block{}
.month-title{font-size:16px;font-weight:500;color:#1a1a18;margin-bottom:10px;padding-left:2px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:#ddd;border:0.5px solid #ccc;border-radius:10px;overflow:hidden}
.dow{background:#f0f0ec;text-align:center;font-size:11px;font-weight:500;color:#777;padding:7px 2px;letter-spacing:.04em}
.day-cell{background:#fff;min-height:88px;padding:5px 5px 4px;position:relative;vertical-align:top}
.day-cell.other-month{background:#f8f8f6}
.day-cell.has-events{cursor:pointer}
.day-cell.has-events:hover{background:#f5f5f0}
.day-cell.today .day-num{background:#1a1a18;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.day-cell.dimmed{opacity:.25}
.day-num{font-size:12px;font-weight:500;color:#999;margin-bottom:3px;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.day-cell.has-events .day-num{color:#444}
.ev-chip{font-size:10px;line-height:1.3;padding:2px 5px;border-radius:4px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.more-badge{font-size:10px;color:#999;padding-left:4px;margin-top:1px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding:12px 16px;background:#fff;border:0.5px solid #ddd;border-radius:10px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#555}
.leg-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:20px 24px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;position:relative}
.modal-date{font-size:14px;font-weight:500;color:#555;margin-bottom:14px;padding-right:28px}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:0.5px solid #ccc;border-radius:6px;cursor:pointer;color:#555;font-size:16px;line-height:1;padding:4px 8px}
.modal-close:hover{background:#f0f0ec}
.modal-ev{padding:10px 12px;border-radius:8px;margin-bottom:8px;border:0.5px solid transparent}
.modal-ev .pills{margin-bottom:6px}
.modal-ev .pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;margin-right:4px;font-weight:500}
.modal-ev .ev-text{font-size:13px;line-height:1.55;color:#1a1a18}
</style>
</head>

  {d:'2026-06-12',t:'Devolución libros Xarxa. Firma actas evaluación extraordinaria 2º Bach. Reunión informativa coordinadora PAU aula 226 (09:55h). Inicio reclamaciones extraordinaria 2º CFGS. Graduación y entrega orlas 2º Bach, 4º ESO y 2º FPB',c:['Evaluación / Actas','Reclamaciones','PAU','Otros']},
  {d:'2026-06-15',t:'Matrícula PAU extraordinaria. Publicación boletines 1º Bach/CFGM/GS/Grado Básico (Webfamilia). Reclamaciones extraordinaria 2º CFGS. Presentación proyectos 2º CF LOE (aprobados en extraordinaria)',c:['Matrícula','Publicación calificaciones','Reclamaciones','Proyectos CF']},

  {d:'2026-06-18',t:'Matrícula PAU extraordinaria — último día. Publicación boletines ESO (09:00h). Inicio entrega requisito académico Bachillerato. Revisión y reclamación calificaciones ordinaria 9-13h. Inicio requisito académico FPB. Último día lectivo',c:['Matrícula','Publicación calificaciones','Reclamaciones','Otros']},

const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DAYS_ES = ['Lu','Ma','Mi','Ju','Vi','Sa','Do'];
const TODAY = new Date(2026,4,15);
const SHOW_MONTHS = [{y:2026,m:4},{y:2026,m:5},{y:2026,m:6}];

let activeCat = null;

function buildCats(){
  const c = document.getElementById('cats');
  Object.keys(CATS).forEach(cat=>{
    const b = document.createElement('button');
    b.className='cat-btn'; b.textContent=cat;
    b.onclick=()=>{ activeCat=activeCat===cat?null:cat; document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active')); if(activeCat)b.classList.add('active'); render(); };
    c.appendChild(b);
  });
}

function buildLegend(){
  const l = document.getElementById('legend');
  Object.entries(CATS).forEach(([name,col])=>{
    const d = document.createElement('div'); d.className='leg-item';
    d.innerHTML=`<div class="leg-dot" style="background:${col.bg};border:1px solid ${col.color}55"></div><span>${name}</span>`;
    l.appendChild(d);
  });
}

function getEventsForDay(ds){
  const q = document.getElementById('search').value.toLowerCase().trim();
  return EVENTS.filter(e=>{
    if(e.d!==ds) return false;
    if(activeCat && !e.c.includes(activeCat)) return false;
    if(q && !e.t.toLowerCase().includes(q) && !e.c.some(x=>x.toLowerCase().includes(q))) return false;
    return true;
  });
}

function anyEventInMonth(y,m){
  const prefix = `${y}-${String(m+1).padStart(2,'0')}`;
  return EVENTS.some(e=>e.d.startsWith(prefix));
}

function renderMonth(y,m){
  const isFiltering = !!(activeCat || document.getElementById('search').value.trim());
  const firstDay = new Date(y,m,1);
  let startDow = firstDay.getDay(); startDow = startDow===0?6:startDow-1;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();

  let html = `<div class="month-block"><div class="month-title">${MONTHS_ES[m]} ${y}</div><div class="cal-grid">`;
  html += DAYS_ES.map(d=>`<div class="dow">${d}</div>`).join('');

  for(let i=0;i<startDow;i++){
    html+=`<div class="day-cell other-month"><div class="day-num" style="color:#ccc">${prevDays-startDow+1+i}</div></div>`;
  }

  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=getEventsForDay(ds);
    const isToday=d===TODAY.getDate()&&m===TODAY.getMonth()&&y===TODAY.getFullYear();
    const allEvs=EVENTS.filter(e=>e.d===ds);
    const hasMatch=!isFiltering||evs.length>0;
    const dimmed=isFiltering&&!hasMatch&&allEvs.length>0?' dimmed':'';
    const hasEv=evs.length>0;

    let inner=`<div class="day-num">${d}</div>`;
    evs.slice(0,2).forEach(e=>{
      const col=CATS[e.c[0]]||CATS['Otros'];
      inner+=`<div class="ev-chip" style="background:${col.bg};color:${col.color}" title="${e.t}">${e.c[0]}</div>`;
    });
    if(evs.length>2) inner+=`<div class="more-badge">+${evs.length-2} más</div>`;

    html+=`<div class="day-cell${isToday?' today':''}${hasEv?' has-events':''}${dimmed}" ${hasEv?`onclick="openDay('${ds}')"`:''}">${inner}</div>`;
  }

  const cells=startDow+daysInMonth;
  const rem=cells%7===0?0:7-(cells%7);
  for(let i=1;i<=rem;i++) html+=`<div class="day-cell other-month"><div class="day-num" style="color:#ccc">${i}</div></div>`;

  html+=`</div></div>`;
  return html;
}

function render(){
  const wrap = document.getElementById('months-wrap');
  wrap.innerHTML = SHOW_MONTHS.map(({y,m})=>renderMonth(y,m)).join('');
  closeModal();
}

function openDay(ds){
  const evs=getEventsForDay(ds);
  if(!evs.length) return;
  const [y,m,d]=ds.split('-');
  document.getElementById('modal-date').textContent=`${parseInt(d)} de ${MONTHS_ES[parseInt(m)-1]} de ${y}`;
  let html='';
  evs.forEach(e=>{
    const col=CATS[e.c[0]]||CATS['Otros'];
    const pills=e.c.map(cat=>{const cc=CATS[cat]||CATS['Otros'];return`<span class="pill" style="background:${cc.bg};color:${cc.color}">${cat}</span>`;}).join('');
    html+=`<div class="modal-ev" style="background:${col.bg}22;border-color:${col.bg}"><div class="pills">${pills}</div><div class="ev-text">${e.t}</div></div>`;
  });
  document.getElementById('modal-events').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }
function handleOverlayClick(e){ if(e.target===document.getElementById('modal-overlay')) closeModal(); }

buildCats();
buildLegend();
render();
</script>
</body>
</html>
